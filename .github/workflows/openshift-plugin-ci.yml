name: OpenShift Plugin CI

on:
  push:
    paths:
      - 'plugins/openshift/**'
  pull_request:
    paths:
      - 'plugins/openshift/**'

jobs:
  openshift-plugin:
    name: Test OpenShift Plugin
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run tests with coverage
      run: |
        cd plugins/openshift
        yarn test --watchAll=false --coverage --coverageReporters=text-lcov --coverageReporters=html
      env:
        CI: true

    - name: Check coverage threshold
      run: |
        cd plugins/openshift
        yarn test --watchAll=false --coverage --coverageThreshold='{"global":{"branches":70,"functions":70,"lines":70,"statements":70}}'
      continue-on-error: true

    - name: Lint
      run: |
        cd plugins/openshift
        yarn lint

    - name: Type check
      run: |
        cd plugins/openshift
        yarn tsc --noEmit

    - name: Build
      run: |
        cd plugins/openshift
        yarn build

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = './plugins/openshift/coverage/lcov-report/index.html';
          
          // Create a simple coverage summary comment
          const comment = `
          ## 🧪 OpenShift Plugin Test Results
          
          ✅ Tests completed successfully!
          
          📊 Coverage report generated and available in the artifacts.
          
          🔧 All linting and type checks passed.
          
          🏗️ Build completed successfully.
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Upload coverage artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: openshift-plugin-coverage
        path: |
          plugins/openshift/coverage/
        retention-days: 14 
